version: "3"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - 9870:9870
      - 9000:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop.env

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always
    ports:
      - 8088:8088
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    env_file:
      - ./hadoop.env

  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop.env

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    restart: always
    env_file:
      - ./hadoop.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-postgresql/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "10000:10000"

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    restart: always
    env_file:
      - ./hadoop.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 hive-metastore-postgresql:5432"
    ports:
      - "9083:9083"

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    restart: always
    volumes:
      - hive_metastore_postgresql:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ---------------------------- Spark ----------------------------
  spark-master:
    build: ../spark
    image: cic-spark:3.5.1
    container_name: spark-master
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ..:/opt/project

  spark-worker-1:
    image: cic-spark:3.5.1
    container_name: spark-worker-1
    restart: always
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 3g --webui-port 8081 spark://spark-master:7077
    ports:
      - "8081:8081"
    volumes:
      - ..:/opt/project

  spark-worker-2:
    image: cic-spark:3.5.1
    container_name: spark-worker-2
    restart: always
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 3g --webui-port 8082 spark://spark-master:7077
    ports:
      - "8082:8082"
    volumes:
      - ..:/opt/project

  jupyter:
    image: cic-spark:3.5.1
    container_name: jupyter
    hostname: jupyter
    restart: always
    depends_on:
      - spark-master
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token='' --ServerApp.root_dir=/opt/project
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ..:/opt/project
      # Dữ liệu benchmark cho pandas: đọc từ volume Linux, không qua bind mount Windows (chậm)
      - bench_local:/bench_local

volumes:
  bench_local:
  hadoop_namenode:
  hadoop_datanode:
  hive_metastore_postgresql:
